name: Sync Warframe resource images

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GameGPS
        uses: actions/checkout@v4

      - name: Download WFCD resource images and build map
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/warframe/resources
          python - <<'PY'
          import json, pathlib, urllib.request

          base = 'https://raw.githubusercontent.com/WFCD/warframe-items/master/data/'
          with urllib.request.urlopen(base + 'json/Resources.json', timeout=60) as r:
              items = json.load(r)

          dest = pathlib.Path('assets/warframe/resources')
          image_map = {}
          source_names = set()

          def walk(value):
              if isinstance(value, dict):
                  name = value.get('name')
                  image = value.get('imageName')
                  if image:
                      image = str(image).lstrip('/')
                      source_names.add(image)
                      if name:
                          image_map[str(name).strip().lower()] = pathlib.Path(image).name
                  for child in value.values():
                      walk(child)
              elif isinstance(value, list):
                  for child in value:
                      walk(child)

          walk(items)

          ok = 0
          for image in sorted(source_names):
              target = dest / pathlib.Path(image).name
              try:
                  with urllib.request.urlopen(base + 'img/' + image, timeout=30) as r:
                      target.write_bytes(r.read())
                  ok += 1
              except Exception as exc:
                  print(f'WARN {image}: {exc}')

          pathlib.Path('assets/warframe/resource-image-map.json').write_text(
              json.dumps(image_map, ensure_ascii=False, sort_keys=True, indent=2) + '\n',
              encoding='utf-8'
          )
          print(f'Synced {ok}/{len(source_names)} WFCD resource images; mapped {len(image_map)} resource names')
          PY

      - name: Commit updated images and map
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'gamegps-bot'
          git config user.email 'gamegps-bot@users.noreply.github.com'
          git add assets/warframe/resources assets/warframe/resource-image-map.json
          if git diff --cached --quiet; then
            echo 'No image changes.'
            exit 0
          fi
          git commit -m 'Sync Warframe resource images and map'
          git push
